[project]
name = "ai-pack"
version = "0.3.2"
description = "Bundle source code into a single file for LLM consumption"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pathspec>=0.12",
    "tiktoken>=0.7",
    "chardet>=5.0",
]

[project.scripts]
ai-pack = "aipack.cli:pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipack"]
